spring.application.name=Travel
server.port=8085

# H2 Database configuration (Embedded & Out-of-the-box ready)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:traveldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS S3 (use env vars in production; defaults allow local startup without AWS)
aws.access-key=${AWS_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY:YOUR_AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:travelplannerimg}
aws.s3.bucket-name=${AWS_S3_BUCKET:travelplannerimg}